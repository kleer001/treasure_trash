name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies to install — tests use Node's built-in runner.
      - run: npm test
      # The verifier is what makes every par, trap count and diagram in levels.md a
      # proven claim rather than an asserted one. Unrun, those laws protect nothing.
      - run: npm run verify
