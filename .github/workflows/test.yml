name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Tests use Node's built-in runner, so today there is nothing to install and
      # this step is a no-op. The day a devDependency arrives it brings a lockfile,
      # and CI must install from it or the run fails on an import that resolves
      # fine on the machine it was written on.
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      - run: npm test
      # npm test checks the rules; this checks the level data. A rules change can leave
      # the tests green and silently invalidate a declared par.
      - name: Verify the level pack
        run: node tools/verify.mjs
      # The bundler flattens every module into one scope, so it breaks in ways the served
      # game cannot: a module left out, an alias dropped, two modules declaring one name.
      # It carries guards for all three, and they only fire if something runs the build.
      - name: Bundle the artifact
        run: node tools/build-artifact.mjs
