name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies to install — tests use Node's built-in runner.
      - run: npm test
      # npm test checks the rules; this checks the level data. A rules change can leave
      # the tests green and silently invalidate a declared par.
      - name: Verify the level pack
        run: node tools/verify.mjs
