name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Tests use Node's built-in runner, so today there is nothing to install and
      # this step is a no-op. The day a devDependency arrives it brings a lockfile,
      # and CI must install from it or the run fails on an import that resolves
      # fine on the machine it was written on.
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      - run: npm test
      # npm test checks the rules; this checks the level data. A rules change can leave
      # the tests green and silently invalidate a declared par.
      - name: Verify the level pack
        run: node tools/verify.mjs
      # Every sanctioned second implementation of the rules, against src/rules.js, over every
      # shipped room and a seeded batch of generated ones. With none registered this runs the
      # reference adapter and proves the harness, which is the state it has to be kept in: a
      # conformance suite first exercised on the day somebody needs it is not a gate.
      - name: Conformance
        run: node tools/conform.mjs
      # The Rust port answers `step` and skips `answer`, which conform.mjs reports as skips
      # rather than passes. What this pins is the rules, one board and one direction at a time.
      - name: Build the sanctioned port
        run: cargo build --release --manifest-path engine/Cargo.toml
      - name: Conformance — the sanctioned port
        run: node tools/conform.mjs --engine engine/target/release/tt-engine --steps 1000000 --random 120
      # The bundler flattens every module into one scope, so it breaks in ways the served
      # game cannot: a module left out, an alias dropped, two modules declaring one name.
      # It carries guards for all three, and they only fire if something runs the build.
      - name: Bundle the artifact
        run: node tools/build-artifact.mjs
