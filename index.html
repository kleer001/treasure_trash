<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Treasure Trash</title>
  <meta name="description" content="An untimed Sokoban-family block-pusher: every bag you tear sprays permanent trash, so aim your mess away from your way out." />
  <link rel="stylesheet" href="styles.css" />
  <!-- The bag, on the house yellow. Inlined so the page never asks for a file it hasn't got. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffcf00'/%3E%3Cpath d='M7 11h18l-2 16H9z' fill='%23161616'/%3E%3Cpath d='M7 11l3-5h12l3 5z' fill='%23161616'/%3E%3C/svg%3E" />
</head>
<body>
<div class="wrap">
  <header>
    <h1>Treasure Trash</h1>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="hud">
    <span class="name" id="lvlname"></span>
    <span class="moves">moves <b id="moves">0</b> · par <b id="par">0</b></span>
    <span class="warn" id="warn"></span>
    <span class="arm" id="arm"></span>
  </div>

  <canvas id="board" width="300" height="300" aria-label="the alley"></canvas>

  <!-- Under the board, in the order you reach for them: the d-pad as a WASD triangle, then
       moving between rooms, then the two that undo what you did inside one. -->
  <div class="controls" id="controls">
    <div class="pad">
      <button class="act key" data-act="up" aria-label="up">↑</button>
      <div class="padrow">
        <button class="act key" data-act="left" aria-label="left">←</button>
        <button class="act key" data-act="down" aria-label="down">↓</button>
        <button class="act key" data-act="right" aria-label="right">→</button>
      </div>
    </div>
    <div class="row">
      <button class="act" data-act="prev">‹ Prev</button>
      <button class="act" data-act="next">Next ›</button>
    </div>
    <div class="row">
      <button class="act" data-act="undo">⟲ Undo (U)</button>
      <button class="act" data-act="restart">↺ Restart (R)</button>
    </div>
  </div>
</div>

<!-- ES modules need http:// — opening this file directly will not work. Use ./run.sh -->
<script type="module" src="src/main.js"></script>
</body>
</html>
