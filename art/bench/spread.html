<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trash Spread</title>
<style>
  :root { --ink: #1a1a1a; --bg: #fafafa; --line: #d8d8d4; --muted: #6b6b66; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 0 0 6px; }
  .bar { position: sticky; top: 0; z-index: 1; background: var(--bg); display: flex; gap: 8px; align-items: center;
         flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .bar .grp { display: flex; gap: 4px; align-items: center; margin-right: 10px; }
  button { font: inherit; padding: 3px 9px; border: 1px solid var(--ink); background: #fff; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  canvas { display: block; image-rendering: pixelated; }
  .panels { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .panel { border: 1px solid var(--line); background: #fff; padding: 8px; width: min-content; }
  .ctl { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; margin-top: 6px; font-size: 13px; }
  .ctl input { width: 100%; min-width: 140px; }
  .ctl .read { min-width: 90px; color: var(--muted); }
  .muted { color: var(--muted); font-size: 12px; }
  .cover { margin-top: 6px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<h1>Trash spread — four ways to lay trash over its cells</h1>
<div class="muted">The same room and the same trash cells in each panel. Layouts: src/art/spread.js and src/art/pile.js. Pile look: src/art/look.json.</div>
<div class="bar">
  <span class="grp">Zoom: <button id="z-">−</button><span id="z"></span><button id="z+">+</button></span>
  <span class="grp">Seed: <button id="s-">−</button><span id="s"></span><button id="s+">+</button></span>
  <span class="grp">Outline round: <button data-wrap="cell">each cell</button><button data-wrap="spill">the whole spill</button></span>
  <span class="grp">Accent hues per (A, B, C): <button data-hues="cell">cell</button><button data-hues="piece">piece</button></span>
  <span class="grp">Floor seams: <button data-seams="on">on</button><button data-seams="off">off</button></span>
  <span class="grp">Mark trash cells: <button data-mark="on">on</button><button data-mark="off">off</button></span>
</div>
<div class="panels" id="panels"></div>
<script type="module">
import { createTrash, settle, drawPile, ORDER } from '../../src/art/pile.js';
import { spreadPiles } from '../../src/art/spread.js';
import { loadSpread, save as store, SPREAD } from './trash/settings.js';
import { wallTile } from '../../src/art/room.js';

const C = 24, FLOOR = '#896e6e', SEAM = '#584c62', MARK = '#f1c84b';
const [D, A, O, LOOK] = await Promise.all(['../../src/art/items.json', '../../src/art/assets.json', '../../src/art/objects.json', '../../src/art/look.json'].map(f => fetch(f).then(r => r.json())));
const T = createTrash(D, { accents: LOOK.accents, diagonals: LOOK.diagonals });
const STYLE = { outline: LOOK.outline, shadow: LOOK.shadow };

const SLIDERS = {
  min: ['Bits per cell, least', 1, 40, 1, v => v],
  max: ['Bits per cell, most', 1, 40, 1, v => v],
  n: ['Bits per cell', 4, 40, 1, v => v],
  spill: ['Spill past the edge', 0, 50, 1, v => `${v}% of a cell`],
  knit: ['Blend across a seam to trash', 0, 12, 1, v => `${v} px each side`],
  falloff: ['How fast the fringe thins', 3, 40, 1, v => `power ${(v / 10).toFixed(1)}`],
  rough: ['Ragged edge', 0, 12, 1, v => `${v} px`],
  jitter: ['Jitter in each grid square', 0, 100, 5, v => `${v}%`],
};
const ui = loadSpread(LOOK);
const save = () => store(SPREAD, ui);
const METHODS = [
  { id: 'mound', title: 'Now — a mound per cell' },
  { id: 'flat', title: 'A — flat, even over each cell' },
  { id: 'edges', title: 'B — edges match the neighbours' },
  { id: 'field', title: 'C — one field over the board' },
].map(m => ({ ...m, keys: Object.keys(ui[m.id]) }));

// The room. W wall, p trash, @ raccoon; standing objects b bin, j jug; lying objects C couch
// (two cells), x box, t tyre. The raccoon walks, so it blocks nothing.
const ROOM = [
  'WWWWWWWWWWWW',
  'Wppp...pCCbW',
  'Wp@p.......W',
  'W.....p..ppW',
  'W..x..pp.ppW',
  'W.p.......jW',
  'W....tppp..W',
  'WWWWWWWWWWWW',
];
const RW = ROOM[0].length, RH = ROOM.length, PW = RW * C, PH = RH * C;
const glyph = (x, y) => (x < 0 || y < 0 || x >= RW || y >= RH ? 'W' : ROOM[y][x]);
const isTrash = (x, y) => glyph(x, y) === 'p';
const cellsOf = ch => ROOM.flatMap((r, y) => [...r].map((c, x) => c === ch ? [x, y] : null)).filter(Boolean);
const CELLS = cellsOf('p');
const at = (spr, cx, cy) => [cx * C + Math.floor((C - spr.w) / 2), cy * C + C - spr.h - 1];
const STAND = { b: O.bin, j: O.jug }, LIE = { C: O.couch, t: O.tyre, x: O.box };
const OBJECTS = [
  ...Object.entries(LIE).flatMap(([ch, spr]) => {
    const runs = [];
    for (const [x, y] of cellsOf(ch)) { const r = runs.find(r => r.y === y && r.x1 === x - 1); if (r) r.x1 = x; else runs.push({ y, x0: x, x1: x }); }
    return runs.map(r => [spr, r.x0 * C + Math.floor(((r.x1 - r.x0 + 1) * C - spr.w) / 2), r.y * C + Math.floor((C - spr.h) / 2)]);
  }),
  ...Object.entries(STAND).flatMap(([ch, spr]) => cellsOf(ch).map(([x, y]) => [spr, ...at(spr, x, y)])),
];

/** Object pixels more than `under` pixels in from their object's edge: trash stops there. */
function deepMask(under) {
  let m = new Uint8Array(PW * PH);
  for (const [spr, x0, y0] of OBJECTS) for (const [px, py] of spr.px) m[(y0 + py) * PW + x0 + px] = 1;
  for (let k = 0; k < under; k++) {
    const e = new Uint8Array(PW * PH);
    for (let y = 1; y < PH - 1; y++) for (let x = 1; x < PW - 1; x++) {
      let all = 1;
      for (let dy = -1; dy <= 1 && all; dy++) for (let dx = -1; dx <= 1; dx++) if (!m[(y + dy) * PW + x + dx]) { all = 0; break; }
      e[y * PW + x] = all;
    }
    m = e;
  }
  return m;
}
const DEEP = deepMask(LOOK.under);
const blockedAt = (cx, cy) => (x, y) => {
  const bx = cx * C + x, by = cy * C + y;
  if (bx < 0 || by < 0 || bx >= PW || by >= PH) return true;
  return glyph(Math.floor(bx / C), Math.floor(by / C)) === 'W' || DEEP[by * PW + bx] === 1;
};

// The pixels each coverage figure counts.
const Z = { middle: [], seam: [], fringe: [] };
for (let py = 0; py < PH; py++) for (let px = 0; px < PW; px++) {
  const x = Math.floor(px / C), y = Math.floor(py / C), lx = px - x * C, ly = py - y * C, i = py * PW + px;
  if (isTrash(x, y)) {
    if (Math.max(Math.abs(lx - 11.5), Math.abs(ly - 11.5)) <= 5) Z.middle.push(i);
    if ((lx < 3 && isTrash(x - 1, y)) || (lx > C - 4 && isTrash(x + 1, y)) || (ly < 3 && isTrash(x, y - 1)) || (ly > C - 4 && isTrash(x, y + 1))) Z.seam.push(i);
  } else if (glyph(x, y) !== 'W') {
    let near = false;
    for (let dy = -6; dy <= 6 && !near; dy++) for (let dx = -6; dx <= 6; dx++)
      if (isTrash(Math.floor((px + dx) / C), Math.floor((py + dy) / C))) { near = true; break; }
    if (near) Z.fringe.push(i);
  }
}

function drawSpr(g, spr, x, y) { for (const [px, py, col] of spr.px) { g.fillStyle = col; g.fillRect(x + px, y + py, 1, 1); } }

function paint(g, piles) {
  g.fillStyle = FLOOR; g.fillRect(0, 0, PW, PH);
  if (ui.seams === 'on') {
    g.fillStyle = SEAM;
    for (let k = 0; k < RW; k++) g.fillRect(k * C + C - 1, 0, 1, PH);
    for (let k = 0; k < RH; k++) g.fillRect(0, k * C + C - 1, PW, 1);
  }
  const world = [];
  for (const [k, pile] of piles) {
    const [x, y] = k.split(',').map(Number);
    for (const p of pile.pieces) world.push({ ...p, x: p.x + x * C, y: p.y + y * C });
  }
  if (ui.wrap === 'cell') for (const [x, y] of CELLS) { const p = piles.get(`${x},${y}`); if (p?.pieces.length) drawPile(g, T, p, x * C, y * C, STYLE); }
  else if (world.length) drawPile(g, T, { pieces: world.sort((a, b) => ORDER[a.layer] - ORDER[b.layer]) }, 0, 0, STYLE);
  for (const [spr, x, y] of [...OBJECTS].sort((a, b) => a[2] + a[0].h - b[2] - b[0].h)) drawSpr(g, spr, x, y);
  for (const [x, y] of cellsOf('W')) wallTile(g, x, y, C);
  for (const [x, y] of cellsOf('@')) drawSpr(g, A.raccoon, ...at(A.raccoon, x, y));
  if (ui.mark === 'on') { g.strokeStyle = MARK; g.lineWidth = 1; for (const [x, y] of CELLS) g.strokeRect(x * C + 0.5, y * C + 0.5, C - 1, C - 1); }
  return world;
}

function coverage(world) {
  const m = new Uint8Array(PW * PH);
  for (const p of world) for (const [px, py] of T.sprite(p.name, p.alt, p.turn).px) {
    const x = p.x + px, y = p.y + py;
    if (x >= 0 && y >= 0 && x < PW && y < PH) m[y * PW + x] = 1;
  }
  const pc = list => Math.round(100 * list.filter(i => m[i]).length / list.length);
  return `Pixels covered: cell middles ${pc(Z.middle)}% · seams between trash cells ${pc(Z.seam)}% · floor within 6 px of trash ${pc(Z.fringe)}% · ${world.length} pieces`;
}

function renderPanel(m) {
  const el = document.getElementById(`p-${m.id}`), o = ui[m.id];
  const piles = spreadPiles(T, m.id, o, { C, W: RW, H: RH, cells: CELLS, isTrash, seed: ui.seed, hues: ui.hues });
  for (const [k, pile] of piles) { const [x, y] = k.split(',').map(Number); piles.set(k, settle(T, pile, blockedAt(x, y))); }
  const off = document.createElement('canvas'); off.width = PW; off.height = PH;
  const world = paint(off.getContext('2d'), piles);
  const cv = el.querySelector('canvas'); cv.width = PW * ui.zoom; cv.height = PH * ui.zoom;
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(off, 0, 0, cv.width, cv.height);
  el.querySelector('.cover').textContent = coverage(world);
  for (const k of m.keys) {
    el.querySelector(`#${m.id}-${k}`).value = o[k];
    el.querySelector(`#${m.id}-${k}-read`).textContent = SLIDERS[k][4](o[k]);
  }
}

const root = document.getElementById('panels');
for (const m of METHODS) {
  const el = document.createElement('div'); el.className = 'panel'; el.id = `p-${m.id}`;
  el.innerHTML = `<h2>${m.title}</h2><canvas></canvas><div class="cover"></div><div class="ctl">${m.keys.map(k => {
    const [label, lo, hi, step] = SLIDERS[k];
    return `<label for="${m.id}-${k}">${label}</label><input type="range" id="${m.id}-${k}" min="${lo}" max="${hi}" step="${step}"><span class="read" id="${m.id}-${k}-read"></span>`;
  }).join('')}</div>`;
  root.append(el);
  for (const k of m.keys) el.querySelector(`#${m.id}-${k}`).oninput = e => {
    const o = ui[m.id]; o[k] = Number(e.target.value);
    if (k === 'min' && o.max < o.min) o.max = o.min;
    if (k === 'max' && o.min > o.max) o.min = o.max;
    save(); renderPanel(m);
  };
}

function render() {
  document.getElementById('z').textContent = `${ui.zoom}×`;
  document.getElementById('s').textContent = ui.seed;
  for (const k of ['wrap', 'hues', 'seams', 'mark']) document.querySelectorAll(`[data-${k}]`).forEach(b => b.setAttribute('aria-pressed', b.dataset[k] === ui[k]));
  for (const m of METHODS) renderPanel(m);
}
const step = (id, fn) => document.getElementById(id).onclick = () => { fn(); save(); render(); };
step('z-', () => { ui.zoom = Math.max(1, ui.zoom - 1); });
step('z+', () => { ui.zoom = Math.min(8, ui.zoom + 1); });
step('s-', () => { ui.seed -= 1; });
step('s+', () => { ui.seed += 1; });
for (const k of ['wrap', 'hues', 'seams', 'mark']) document.querySelectorAll(`[data-${k}]`).forEach(b =>
  b.onclick = () => { ui[k] = b.dataset[k]; save(); render(); });
render();
</script>
</body>
</html>
