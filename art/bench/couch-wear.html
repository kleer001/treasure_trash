<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Couch wear</title>
<style>
  body { margin: 0; padding: 16px; background: #f7f6f3; color: #1a1a1a; font: 15px/1.35 system-ui, sans-serif; display: flex; gap: 24px; align-items: flex-start; }
  canvas { display: block; image-rendering: pixelated; position: sticky; top: 16px; }
  .side { display: grid; gap: 10px; width: 470px; }
  fieldset { border: 1px solid #c9c6bd; padding: 6px 10px 8px; display: grid; gap: 4px; }
  legend { font-weight: 600; }
  label { display: grid; grid-template-columns: 150px 1fr 64px; gap: 8px; align-items: center; }
  label input[type=number] { width: 60px; font: inherit; }
  label input[type=color] { width: 60px; height: 24px; padding: 0; border: 1px solid #888; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: 4px 12px; border: 1px solid #1a1a1a; background: #fff; cursor: pointer; }
  textarea { font: inherit; width: 100%; box-sizing: border-box; min-height: 5em; }
  .muted { color: #6b6b66; font-size: 13px; }
  .bad { color: #b3261e; font-weight: 600; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="side">
  <div class="row"><span>seed</span><button id="sprev">−</button><span id="seed"></span><button id="snext">+</button><button id="roll">Random seed</button><button id="reset">Back to defaults</button></div>
  <div class="row"><span>zoom</span><button id="zout">−</button><span id="zoom"></span><button id="zin">+</button></div>
  <textarea id="note" placeholder="Note on the couch"></textarea>
  <div id="status" class="muted"></div>
  <div id="knobs" class="side" style="width:auto"></div>
</div>
<script type="module">
import { couchViews, COUCH_LOOK } from '../../src/art/couch.js';
import { ACTIONS, draw as drawRaccoon, mirror } from '../../src/art/cartoon.js';
import { VIEW } from '../../src/art/press.js';
import { C, FLOOR, SEAM } from '../../src/art/flight.js';
import { wallTile } from '../../src/art/room.js';

const KEY = 'trash-couch-wear', COLS = 10, ROWS = 7, $ = id => document.getElementById(id);
// [legend, [key, label, min, max, step], or [key, label] for a colour, or [key, 'on', label?] for a switch]
const GROUPS = [
  ['Where wear goes', [['minShade', 'darkest shade worn (0–5)', 0, 5, 1]]],
  ['Stains', [['stainsOn', 'on'], ['stainsCushion', 'on', 'stays on its cushion'], ['stains', 'count', 0, 10, 0.5], ['stainMin', 'size min px', 0.5, 8, 0.5], ['stainMax', 'size max px', 0.5, 10, 0.5],
    ['stainDensity', 'fill density', 0, 1, 0.05], ['stainRing', 'ring density', 0, 1, 0.05], ['stainOpacity', 'opacity', 0, 1, 0.05], ['stainColour', 'colour'], ['ringColour', 'ring colour']]],
  ['Mould', [['mouldOn', 'on'], ['mouldCushion', 'on', 'stays on its cushion'], ['mould', 'patches', 0, 12, 0.5], ['mouldSize', 'patch size px', 1, 12, 0.5], ['mouldDensity', 'density', 0, 1, 0.05],
    ['mouldLit', 'light specks', 0, 1, 0.05], ['mouldOpacity', 'opacity', 0, 1, 0.05], ['mouldColour', 'colour'], ['mouldLight', 'light colour']]],
  ['Cracks', [['cracksOn', 'on'], ['cracksCushion', 'on', 'stays on its cushion'], ['cracks', 'count', 0, 20, 1], ['crackLen', 'length px', 1, 14, 1], ['crackWiggle', 'wiggle', 0, 1.5, 0.05], ['crackDepth', 'shades darker', 1, 4, 1]]],
  ['Rips', [['ripsOn', 'on'], ['ripsCushion', 'on', 'stays on its cushion'], ['rips', 'count', 0, 8, 0.5], ['ripMin', 'size min px', 0.5, 6, 0.5], ['ripMax', 'size max px', 0.5, 8, 0.5],
    ['ripAspect', 'width ÷ height', 0.5, 3, 0.1], ['ripJag', 'ragged edge', 0, 1, 0.05], ['hole', 'chance of a dark hole', 0, 1, 0.05],
    ['rim', 'torn rim', 0, 1, 0.05], ['flap', 'chance of a flap', 0, 1, 0.05], ['flapLen', 'flap length px', 1, 8, 1],
    ['stuffing', 'stuffing'], ['stuffShade', 'stuffing shade'], ['holeColour', 'hole'], ['rimColour', 'rim and flap']]],
];
let s = { ...COUCH_LOOK, zoom: 5 };
try { const saved = JSON.parse(localStorage.getItem(KEY) ?? '{}'); for (const k in s) if (saved[k] !== undefined) s[k] = saved[k]; } catch {}

for (const [legend, knobs] of GROUPS) {
  const f = document.createElement('fieldset');
  f.innerHTML = `<legend>${legend}</legend>` + knobs.map(([k, label, min, max, step]) => label === 'on'
    ? `<label>${typeof min === 'string' ? min : 'on'}<input id="${k}" type="checkbox" style="justify-self:start"><span></span></label>`
    : min === undefined ? `<label>${label}<input id="${k}" type="color"><span></span></label>`
    : `<label>${label}<input id="${k}" type="range" min="${min}" max="${max}" step="${step}"><input id="${k}n" type="number" step="${step}"></label>`).join('');
  $('knobs').append(f);
  for (const [k, , min] of knobs) {
    if (typeof COUCH_LOOK[k] === 'boolean') $(k).onchange = () => { s[k] = $(k).checked; change(); };
    else if (min === undefined) $(k).oninput = () => { s[k] = $(k).value; change(); };
    else {
      $(k).oninput = () => { s[k] = Number($(k).value); change(); };
      $(k + 'n').onchange = () => { s[k] = Number($(k + 'n').value); change(); };
    }
  }
}

const crop = ({ px }) => {
  const x0 = Math.min(...px.map(p => p[0])), y0 = Math.min(...px.map(p => p[1]));
  return { w: Math.max(...px.map(p => p[0])) - x0 + 1, h: Math.max(...px.map(p => p[1])) - y0 + 1, px: px.map(([x, y, c]) => [x - x0, y - y0, c]) };
};
const sitting = d => crop(d === 'l' ? mirror(drawRaccoon(ACTIONS[VIEW[d]].crawl[0])) : drawRaccoon(ACTIONS[VIEW[d]].crawl[0]));
const RACCOON = { d: sitting('d'), r: sitting('r') };
// [view, col, row, cells across, cells down]
const COUCHES = [['front', 1, 2, 2, 1], ['back', 5, 2, 2, 1], ['left', 2, 4, 1, 2], ['right', 6, 4, 1, 2]];

function draw() {
  for (const [, knobs] of GROUPS) for (const [k, , min] of knobs) {
    if (typeof COUCH_LOOK[k] === 'boolean') { $(k).checked = s[k]; continue; }
    $(k).value = s[k]; if (min !== undefined) $(k + 'n').value = s[k];
  }
  $('seed').textContent = s.seed; $('zoom').textContent = `${s.zoom}×`;
  const views = couchViews(s);
  const src = document.createElement('canvas'); src.width = COLS * C; src.height = ROWS * C;
  const g = src.getContext('2d');
  g.fillStyle = FLOOR; g.fillRect(0, 0, src.width, src.height);
  g.fillStyle = SEAM;
  for (let k = 1; k <= COLS; k++) g.fillRect(k * C - 1, C, 1, src.height);
  for (let k = 1; k <= ROWS; k++) g.fillRect(0, k * C - 1, src.width, 1);
  for (let x = 0; x < COLS; x++) wallTile(g, x, 0, C);
  const put = (spr, x0, y0) => { for (const [x, y, c] of spr.px) { g.fillStyle = c; g.fillRect(x0 + x, y0 + y, 1, 1); } };
  // Centred on its footprint, its foot a pixel above the footprint's bottom edge, as the game stands things.
  const stand = (spr, col, row, w, h) => put(spr, col * C + Math.floor((w * C - spr.w) / 2), (row + h) * C - spr.h - 1);
  const things = [...COUCHES.map(([v, x, y, w, h]) => [y + h, () => stand(views[v], x, y, w, h)]),
    [3, () => stand(RACCOON.d, 4, 2, 1, 1)], [6, () => stand(RACCOON.r, 4, 5, 1, 1)]].sort((a, b) => a[0] - b[0]);
  for (const [, paint] of things) paint();
  const out = $('view'); out.width = src.width * s.zoom; out.height = src.height * s.zoom;
  const o = out.getContext('2d'); o.imageSmoothingEnabled = false; o.drawImage(src, 0, 0, out.width, out.height);
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {}
}
const change = () => { draw(); autosave(); };
$('sprev').onclick = () => { s.seed = Math.max(1, s.seed - 1); change(); };
$('snext').onclick = () => { s.seed += 1; change(); };
$('roll').onclick = () => { s.seed = 1 + Math.floor(Math.random() * 99999); change(); };
$('reset').onclick = () => { s = { ...COUCH_LOOK, zoom: s.zoom }; change(); };
$('zout').onclick = () => { s.zoom = Math.max(1, s.zoom - 1); change(); };
$('zin').onclick = () => { s.zoom = Math.min(12, s.zoom + 1); change(); };
// Every change saves itself to the notes file, the note with it, a moment after the last edit.
let timer = 0;
function autosave() {
  clearTimeout(timer);
  timer = setTimeout(() => fetch('/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ page: 'couch-wear', settings: s, note: $('note').value, at: new Date().toISOString() }) })
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); $('status').className = 'muted'; $('status').textContent = `saved ${new Date().toLocaleTimeString()}`; })
    .catch(e => { $('status').className = 'bad'; $('status').textContent = `not saved: ${e.message}`; }), 600);
}
$('note').oninput = autosave;
draw(); autosave();
</script>
</body>
</html>
