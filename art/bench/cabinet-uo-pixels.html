<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cabinet ↑ open pixels</title>
<style>
  body { margin: 0; padding: 16px; background: #f7f6f3; color: #1a1a1a; font: 16px/1.4 system-ui, sans-serif; display: flex; gap: 28px; align-items: flex-start; }
  canvas { display: block; image-rendering: pixelated; }
  #edit { cursor: crosshair; touch-action: none; border: 1px solid #c9c6bf; }
  .side { display: grid; gap: 12px; }
  .swatches, .side > .row, .side > .muted, textarea { max-width: 360px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .sw { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border: 1px solid #c9c6bf; background: #fff; cursor: pointer; font: 14px system-ui, sans-serif; text-align: left; }
  .sw.on { outline: 3px solid #1a1a1a; outline-offset: -1px; }
  .chip { width: 22px; height: 22px; border: 1px solid #1a1a1a; flex: none; }
  .chip.none { background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 8px 8px; }
  button { font: inherit; padding: 4px 12px; border: 1px solid #1a1a1a; background: #fff; cursor: pointer; }
  textarea { font: inherit; width: 100%; box-sizing: border-box; min-height: 5em; }
  .muted { color: #6b6b66; font-size: 14px; }
  .bad { color: #b3261e; font-weight: 600; }
</style>
</head>
<body>
<canvas id="edit"></canvas>
<div class="side">
  <div class="swatches" id="swatches"></div>
  <div class="row"><button id="undo">Undo</button><button id="restart">Start over</button></div>
  <div class="row"><span>zoom</span><button id="zout">−</button><span id="zoom"></span><button id="zin">+</button></div>
  <div class="muted">Click or drag to paint one pixel at a time. Below, all four open views at game size, ×3; the ↑ one is the one you paint.</div>
  <canvas id="game"></canvas>
  <textarea id="note" placeholder="Note on the drawer"></textarea>
  <div id="status" class="muted"></div>
</div>

<script>
const START = {"look": {"front": 24, "side": 24, "outD": 32, "outU": 19, "depthD": 10, "depthU": 10, "outS": 21, "depthS": 17}, "foot": 45, "mid": 11.5, "rows": [".kkkkkkkkkkkkkkkkkkkkkk.", "kffffffffffffffffffffffk", "kFFFFFFFFFFFFFFFFFFFFFFk", "kFFFFFFFFFFFFFFFFFFFFFFk", "kQEiiiiiiiiiiiiiiiiiiEQk", "kQEiiiiiiiiiiiiiiiiiiEQk", "kQEiiiiiiiiiiiiiiiiiiEQk", "kQEiiiiiiiiiiiiiiiiiiEQk", "kQEiiiiiiiiiiiiiiiiiiEQk", "kQEiiiiiiiiiiiiiiiiiiEQk", "kQEiiiiiiiiiiiiiiiiiiEQk", "kQEiiiiiiiiiiiiiiiiiiEQk", "kQEiiiiiiiiiiiiiiiiiiEQk", "kQEEEEEEEEEEEEEEEEEEEEQk", "kkkkkkkkkkkkkkkkkkkkkkkk", "kQk..................kqk", "kQk..................kqk", "kQk..................kqk", "kQk..................kqk", "kqSSSSSSSSSSSSSSSSSSSSqk", "kBBBBBBBBBBBBBBBBBBBBBBk", "kBBBBBBBBBBBBBBBBBBBBBBk", "kBBBBBBBBBBBBBBBBBBBBBBk", "kBBBBBBBBBBBBBBBBBBBBBBk", "kBBBBBBBBBBBBBBBBBBBBBBk", "kBBBBBBBBBBBBBBBBBBBBBBk", "kbbbbbbbbbbbbbbbbbbbbbbk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kBSSSSSSSSSSSSSSSSSSSSSk", "kSSSSSSSSSSSSSSSSSSSSSSk", ".kggggggggggggggggggggk.", "..kkkkkkkkkkkkkkkkkkkk.."]};
const OTHERS = {"d":{"mid":11.5,"foot":25,"rows":[".kkkkkkkkkkkkkkkkkkkkkk.","kBBBBBBBBBBBBBBBBBBBBBBk","kBBBBBBBBBBBBBBBBBBBBBBk","kBBBBBBBBBBBBBBBBBBBBBBk","kBBBBBBBBBBBBBBBBBBBBBBk","kBBBBBBBBBBBBBBBBBBBBBBk","kBBBBBBBBBBBBBBBBBBBBBBk","kbbbbbbbbbbbbbbbbbbbbbbk","kSSSSSSSSSSSSSSSSSSSSSSk","kSggggggggggggggggggggSk","kSggggggggggggggggggggSk","kSggggggggggggggggggggSk","kQkggggggggggggggggggkqk","kQkggggggggggggggggggkqk","kQkggggggggggggggggggkqk","kQkggggggggggggggggggkqk","kQkggggggggggggggggggkqk","kQkffffffffffffffffffkqk","kQkFFFFFFFFFFFFFFFFFFkqk","kQkFFFFFFFFppFFFFFFFFkqk","kQkFFFFFFFPPPPFFFFFFFkqk","kQkFFFFFFFFFFFFFFFFFFkqk","kQkFFFFFFFFFFFFFFFFFFkqk","kQkFFFFFFFFFFFFFFFFFFkqk","kQkSSSSSSSSSSSSSSSSSSkqk","kQkggggggggggggggggggkqk","kQkkkkkkkkkkkkkkkkkkkkqk","kQk..................kqk","kQk..................kqk","kQk..................kqk","kQk..................kqk","kQEEEEEEEEEEEEEEEEEEEEQk","kQEiiiiiiiiiiiiiiiiiiEQk","kQEiiiiiiiiiiiiiiiiiiEQk","kQEiiiiiiiiiiiiiiiiiiEQk","kQEiiiiiiiiiiiiiiiiiiEQk","kQEiiiiiiiiiiiiiiiiiiEQk","kQEiiiiiiiiiiiiiiiiiiEQk","kQEiiiiiiiiiiiiiiiiiiEQk","kQEiiiiiiiiiiiiiiiiiiEQk","kqEiiiiiiiiiiiiiiiiiiEqk","kffffffffffffffffffffffk","kFFFFFFFFFFFFFFFFFFFFFFk","kFFFFFFFFFFppFFFFFFFFFFk","kFFFFFFFFFPPPPFFFFFFFFFk","kFFFFFFFFFFFFFFFFFFFFFFk","kFFFFFFFFFFFFFFFFFFFFFFk","kFFFFFFFFFFFFFFFFFFFFFFk",".kkkkkkkkkkkkkkkkkkkkkk."]},"l":{"mid":34.5,"foot":24,"rows":["........................kkkkkkkkkkkkkkkkkkkkkk.",".......................kBBBBBBBBBBBBBBBBBBBBBBk",".......................kBBBBBBBBBBBBBBBBBBBBBBk",".......................kBBBBBBBBBBBBBBBBBBBBBBk","..kkkkkkkkkkkkkkkk.....kBBBBBBBBBBBBBBBBBBBBBBk",".kfEEEEEEEEEEEEEEEk....kBBBBBBBBBBBBBBBBBBBBBBk",".kFEiiiiiiiiiiiiiEkkkk.kbbbbbbbbbbbbbbbbbbbbbbk",".kFEiiiiiiiiiiiiiEqqqqkgSSSSSSSSSSSSSSSSSSSSSSk","kPFEiiiiiiiiiiiiiEkkkkkgSSSSSSSSSSSSSSSSSSSSSSk","kpFEEEEEEEEEEEEEEEk...kgSSSSSSSSSSSSSSSSSSSSSSk",".kFSSSSSSSSSSSSSSSkkkkkgSSSSSSSSSSSSSSSSSSSSSSk",".kFSSSSSSSSSSSSQQQQQQQkgSSSSSSSSSSSSSSSSSSSSSSk",".kFSSSSSSSSSSSSSSSkkkkkgSSSSSSSSSSSSSSSSSSSSSSk",".kFSSSSSSSSSSSSSSSk...kgSSSSSSSSSSSSSSSSSSSSSSk","..kkkkkkkkkkkkkkkk....kgSSSSSSSSSSSSSSSSSSSSSSk","......................kfSSSSSSSSSSSSSSSSSSSSSSk","......................kFSSSSSSSSSSSSSSSSSSSSSSk",".....................kPFSSSSSSSSSSSSSSSSSSSSSSk",".....................kpFSSSSSSSSSSSSSSSSSSSSSSk","......................kFSSSSSSSSSSSSSSSSSSSSSSk","......................kFSSSSSSSSSSSSSSSSSSSSSSk","......................kFSSSSSSSSSSSSSSSSSSSSSSk","......................kFSSSSSSSSSSSSSSSSSSSSSSk",".......................kkggggggggggggggggggggk.",".........................kkkkkkkkkkkkkkkkkkkk.."]},"r":{"mid":11.5,"foot":24,"rows":[".kkkkkkkkkkkkkkkkkkkkkk........................","kBBBBBBBBBBBBBBBBBBBBBBk.......................","kBBBBBBBBBBBBBBBBBBBBBBk.......................","kBBBBBBBBBBBBBBBBBBBBBBk.......................","kBBBBBBBBBBBBBBBBBBBBBBk.....kkkkkkkkkkkkkkkk..","kBBBBBBBBBBBBBBBBBBBBBBk....kEEEEEEEEEEEEEEEfk.","kbbbbbbbbbbbbbbbbbbbbbbk.kkkkEiiiiiiiiiiiiiEFk.","kSSSSSSSSSSSSSSSSSSSSSSgkqqqqEiiiiiiiiiiiiiEFk.","kSSSSSSSSSSSSSSSSSSSSSSgkkkkkEiiiiiiiiiiiiiEFPk","kSSSSSSSSSSSSSSSSSSSSSSgk...kEEEEEEEEEEEEEEEFpk","kSSSSSSSSSSSSSSSSSSSSSSgkkkkkSSSSSSSSSSSSSSSFk.","kSSSSSSSSSSSSSSSSSSSSSSgkQQQQQQQSSSSSSSSSSSSFk.","kSSSSSSSSSSSSSSSSSSSSSSgkkkkkSSSSSSSSSSSSSSSFk.","kSSSSSSSSSSSSSSSSSSSSSSgk...kSSSSSSSSSSSSSSSFk.","kSSSSSSSSSSSSSSSSSSSSSSgk....kkkkkkkkkkkkkkkk..","kSSSSSSSSSSSSSSSSSSSSSSfk......................","kSSSSSSSSSSSSSSSSSSSSSSFk......................","kSSSSSSSSSSSSSSSSSSSSSSFPk.....................","kSSSSSSSSSSSSSSSSSSSSSSFpk.....................","kSSSSSSSSSSSSSSSSSSSSSSFk......................","kSSSSSSSSSSSSSSSSSSSSSSFk......................","kSSSSSSSSSSSSSSSSSSSSSSFk......................","kSSSSSSSSSSSSSSSSSSSSSSFk......................",".kggggggggggggggggggggkk.......................","..kkkkkkkkkkkkkkkkkkkk........................."]}};
const ALL = {"k": "#19152b", "B": "#473f53", "b": "#5a5068", "S": "#352e3e", "F": "#50657c", "f": "#6984a1", "g": "#262440", "i": "#211d33", "E": "#80b3b7", "Q": "#9da6ad", "q": "#797f85", "P": "#dbd8b4", "p": "#a9a78b"};
const PALETTE = {"k": "#19152b", "B": "#473f53", "b": "#5a5068", "S": "#352e3e", "F": "#50657c", "f": "#6984a1", "g": "#262440", "i": "#211d33", "E": "#80b3b7", "Q": "#9da6ad", "q": "#797f85"};
const NAMES = {"k": "ink", "B": "top", "b": "top near edge", "S": "carcase", "F": "drawer front", "f": "front lit top", "g": "gap", "i": "drawer inside", "E": "drawer rim", "Q": "rail lit", "q": "rail", "P": "pull lit", "p": "pull"};
const FLOOR = '#896e6e', SEAM = '#584c62', C = 24, KEY = 'trash-cabinet-uo-pixels', $ = id => document.getElementById(id);
let s = { rows: START.rows, ink: 'k', zoom: 16, note: '' };
try { const saved = JSON.parse(localStorage.getItem(KEY) ?? '{}'); for (const k in s) if (saved[k] !== undefined) s[k] = saved[k]; } catch {}
const W = START.rows[0].length, H = START.rows.length, history = [];

$('swatches').innerHTML = [...Object.keys(PALETTE), '.'].map(c => `<button class="sw" data-c="${c}"><span class="chip${c === '.' ? ' none' : ''}" style="${c === '.' ? '' : `background:${PALETTE[c]}`}"></span>${c === '.' ? 'empty' : NAMES[c]}</button>`).join('');
for (const b of document.querySelectorAll('.sw')) b.onclick = () => { s.ink = b.dataset.c; draw(); };

function draw() {
  for (const b of document.querySelectorAll('.sw')) b.classList.toggle('on', b.dataset.c === s.ink);
  $('zoom').textContent = `${s.zoom}×`;
  $('note').value = s.note;
  const z = s.zoom, e = $('edit'); e.width = W * z + 1; e.height = H * z + 1;
  const g = e.getContext('2d');
  g.fillStyle = FLOOR; g.fillRect(0, 0, e.width, e.height);
  s.rows.forEach((r, y) => [...r].forEach((c, x) => { if (c !== '.') { g.fillStyle = PALETTE[c]; g.fillRect(x * z, y * z, z, z); } }));
  g.fillStyle = 'rgba(255,255,255,0.18)';
  for (let x = 0; x <= W; x++) g.fillRect(x * z, 0, 1, e.height);
  for (let y = 0; y <= H; y++) g.fillRect(0, y * z, e.width, 1);
  // A floor of 24 px cells; each open cabinet stands in its cell as the game stands it, the drawer in the next.
  const m = $('game'), p = 3, COLS = 12, ROWS = 4; m.width = COLS * C * p; m.height = ROWS * C * p;
  const o = m.getContext('2d'); o.fillStyle = FLOOR; o.fillRect(0, 0, m.width, m.height);
  o.fillStyle = SEAM;
  for (let k = 1; k < COLS; k++) o.fillRect((k * C - 1) * p, 0, p, m.height);
  for (let k = 1; k < ROWS; k++) o.fillRect(0, (k * C - 1) * p, m.width, p);
  const views = { u: { mid: START.mid, foot: START.foot, rows: s.rows }, ...OTHERS };
  for (const [f, cx, cy] of [['u', 1, 2], ['d', 3, 1], ['r', 5, 2], ['l', 10, 2]]) {
    const v = views[f], x0 = cx * C + C / 2 - Math.ceil(v.mid), y0 = cy * C + C - v.foot - 2;
    v.rows.forEach((r, y) => [...r].forEach((c, x) => { if (c !== '.') { o.fillStyle = ALL[c]; o.fillRect((x0 + x) * p, (y0 + y) * p, p, p); } }));
  }
  autosave();
}

let painting = false;
const at = ev => { const r = $('edit').getBoundingClientRect(); return [Math.floor((ev.clientX - r.left) / s.zoom), Math.floor((ev.clientY - r.top) / s.zoom)]; };
const paint = ev => {
  const [x, y] = at(ev);
  if (x < 0 || y < 0 || x >= W || y >= H || s.rows[y][x] === s.ink) return;
  s.rows = s.rows.map((r, k) => (k === y ? r.slice(0, x) + s.ink + r.slice(x + 1) : r));
  draw();
};
$('edit').onpointerdown = ev => { history.push(s.rows); painting = true; $('edit').setPointerCapture(ev.pointerId); paint(ev); };
$('edit').onpointermove = ev => { if (painting) paint(ev); };
$('edit').onpointerup = () => { painting = false; };
$('undo').onclick = () => { if (history.length) { s.rows = history.pop(); draw(); } };
$('restart').onclick = () => { history.push(s.rows); s.rows = START.rows; draw(); };
$('zout').onclick = () => { s.zoom = Math.max(4, s.zoom - 2); draw(); };
$('zin').onclick = () => { s.zoom = Math.min(40, s.zoom + 2); draw(); };
$('note').oninput = () => { s.note = $('note').value; autosave(); };

// Every change saves itself, to this browser and to the notes file, a moment after the last edit.
let timer = 0;
function autosave() {
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {}
  clearTimeout(timer);
  timer = setTimeout(() => fetch('/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ page: 'cabinet-uo-pixels', look: START.look, rows: s.rows, note: s.note, at: new Date().toISOString() }) })
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); $('status').className = 'muted'; $('status').textContent = `saved ${new Date().toLocaleTimeString()}`; })
    .catch(e => { $('status').className = 'bad'; $('status').textContent = `not saved: ${e.message}`; }), 600);
}
draw();
</script>
</body>
</html>
