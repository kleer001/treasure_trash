<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raccoon Cartoon v1</title>
<style>
  :root { --ink: #1a1a1a; --bg: #fafafa; --line: #d8d8d4; --muted: #6b6b66; --ok: #1d7a3a; --bad: #b3261e; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 12px 0 6px; }
  .bar { position: sticky; top: 0; z-index: 1; background: var(--bg); display: flex; gap: 8px; align-items: center;
         flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .bar .grp { display: flex; gap: 4px; align-items: center; margin-right: 10px; }
  button { font: inherit; padding: 3px 9px; border: 1px solid var(--ink); background: #fff; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  canvas { display: block; image-rendering: pixelated; border: 1px solid var(--line); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-top: 12px; }
  .ctl { display: grid; grid-template-columns: auto 180px auto; gap: 3px 8px; align-items: center; font-size: 13px; }
  .ctl input { width: 100%; }
  .ctl .read { min-width: 60px; color: var(--muted); }
  .ctl label.now { font-weight: 700; }
  .check { font-weight: 600; font-size: 13px; } .check.ok { color: var(--ok); } .check.bad { color: var(--bad); }
  .muted { color: var(--muted); font-size: 12px; max-width: 640px; }
  #strip-wrap { overflow-x: auto; max-width: 100%; }
  #scrub { width: 240px; }
</style>
</head>
<body>
<h1>Raccoon, cartoon, version 1 — crawling one cell and shoving a thing, from the side, the front and the back</h1>
<div class="bar">
  <span class="grp">Action: <button data-act="crawl">crawl one cell</button><button data-act="push">push</button>
    <button data-act="stuck">push, held fast</button><button data-act="idle">sit, idle</button></span>
  <span class="grp">Press: <button data-dir="l">←</button><button data-dir="r">→</button><button data-dir="u">↑</button><button data-dir="d">↓</button></span>
  <span class="grp"><button id="play">pause</button><button id="prev">◀ frame</button><button id="next">frame ▶</button>
    <input type="range" id="scrub" min="0" step="1"></span>
  <span class="grp">Playback speed: <button id="slow">−</button><span id="speed-read"></span><button id="fast">+</button></span>
  <span class="grp">Onion skin: <button id="onion"></button></span>
  <span class="grp">Zoom: <button id="zoom-out">−</button><span id="zoom-read"></span><button id="zoom-in">+</button></span>
</div>
<div class="row">
  <div><canvas id="view"></canvas><div class="muted" id="frame-read"></div></div>
  <div>
    <div class="check" id="check-rules"></div>
    <div class="check" id="check-start"></div>
    <div class="check" id="check-end"></div>
    <div class="check" id="check-touch"></div>
    <h2>Each frame's hold <button id="reset">reset this action</button></h2>
    <div class="ctl" id="ctl"></div>
  </div>
</div>
<h2>Every frame</h2>
<div id="strip-wrap"><canvas id="strip"></canvas></div>
<script type="module">
import { explain, cell, CAN_EMPTY, DIRS } from '../../src/rules.js';
import { toState } from '../../src/format.js';
import { C, FLOOR, SEAM } from '../../src/art/flight.js';
import { wallTile } from '../../src/art/room.js';
import { front as CAN } from '../../src/art/can.js';
import { ACTIONS, draw, mirror } from './trash/cartoon_v1.js';
import { load, save as store } from './trash/settings.js';

const KEY = 'trash-cartoon';
const N = 5, MID = 2, VIEW = { l: 'side', r: 'side', d: 'front', u: 'back' };
const TOUCH = /^(slam|scrab|strain|thud)/;
const authored = Object.fromEntries(Object.entries(ACTIONS).flatMap(([v, as]) => Object.entries(as).map(([a, fs]) => [`${v} ${a}`, fs.map(f => f.ms)])));
const timing = () => `${VIEW[ui.dir]} ${ui.act}`;
const ui = load(KEY, { act: 'crawl', dir: 'r', playing: true, speed: 100, zoom: 5, onion: false, ms: structuredClone(authored) });
const save = () => store(KEY, ui);

const canvasOf = (w, h = w) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const drawPx = (ctx, list, x, y) => { for (const [px, py, col] of list) { ctx.fillStyle = col; ctx.fillRect(x + px, y + py, 1, 1); } };
const at = (spr, cx, cy) => [cx * C + Math.floor((C - spr.w) / 2), cy * C + C - spr.h - 1];
const sprite = f => (ui.dir === 'l' ? mirror(draw(f)) : draw(f));

function setup() {
  const [vx, vy] = DIRS[ui.dir], put = { [`${MID},${MID}`]: '@', '0,0': 'E' };
  if (ui.act === 'push' || ui.act === 'stuck') put[`${MID + vx},${MID + vy}`] = 'c';
  if (ui.act === 'stuck') put[`${MID + 2 * vx},${MID + 2 * vy}`] = '#';
  const grid = Array.from({ length: N }, (_, y) => Array.from({ length: N }, (_, x) => put[`${x},${y}`] ?? '-').join(''));
  const s = toState({ id: 'cartoon', grid });
  const r = ui.act === 'idle' ? { ok: false, reason: 'no press' } : explain(s, ui.dir, { trace: true });
  const moved = r.ok ? r.steps[0].moved : [];
  return { s, r, next: r.ok ? r.next : s, v: [vx, vy],
    rac: r.ok ? Math.abs(r.next.rac.x - s.rac.x) + Math.abs(r.next.rac.y - s.rac.y) : 0,
    can: moved.length ? Math.abs(moved[0].dx) + Math.abs(moved[0].dy) : 0, frames: ACTIONS[VIEW[ui.dir]][ui.act] };
}

function ground(ctx, s) {
  ctx.fillStyle = FLOOR; ctx.fillRect(0, 0, N * C, N * C);
  ctx.fillStyle = SEAM;
  for (let k = 0; k < N; k++) { ctx.fillRect(k * C + C - 1, 0, 1, N * C); ctx.fillRect(0, k * C + C - 1, N * C, 1); }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (cell(s, x, y).wall) wallTile(ctx, x, y, C);
}
/** Sprites `[{px, x, y, h, rac}]`, drawn nearest last. */
const sprites = (ctx, list) => { for (const p of list.sort((a, b) => (a.y + a.h) - (b.y + b.h) || a.rac - b.rac)) drawPx(ctx, p.px, p.x, p.y); };
const cans = s => { const out = []; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (cell(s, x, y).o === CAN_EMPTY) out.push([x, y]); return out; };

/** Frame `f` laid on board `s`. */
function layout(f) {
  const spr = sprite(f), [x0, y0] = at(spr, B.s.rac.x, B.s.rac.y), [vx, vy] = B.v, list = [];
  for (const [x, y] of cans(B.s)) {
    const [cx, cy] = at(CAN, x, y), go = x === MID + vx && y === MID + vy ? (f.thing ?? 0) : 0;
    list.push({ px: CAN.px, x: cx + vx * go, y: cy + vy * go, h: CAN.h, rac: 0 });
  }
  list.push({ px: spr.px, x: x0 + vx * f.dx, y: y0 + vy * f.dx, h: spr.h, rac: 1 });
  return list;
}
const paint = (ctx, f) => { ground(ctx, B.s); sprites(ctx, layout(f)); };
function still(ctx, s) {
  ground(ctx, s);
  const list = cans(s).map(([x, y]) => { const [cx, cy] = at(CAN, x, y); return { px: CAN.px, x: cx, y: cy, h: CAN.h, rac: 0 }; });
  const spr = sprite(B.frames[0]), [rx, ry] = at(spr, s.rac.x, s.rac.y);
  list.push({ px: spr.px, x: rx, y: ry, h: spr.h, rac: 1 });
  sprites(ctx, list);
}
/** Empty px between the raccoon and the shoved can along a push across the screen, in the nearest row both fill. */
function gap(f) {
  const [rac, can] = layout(f).sort((a, b) => b.rac - a.rac), rows = new Map(), d = B.v[0];
  for (const [x, y] of rac.px) { const k = rac.y + y, a = (rac.x + x) * d; rows.set(k, Math.max(rows.get(k) ?? -Infinity, a)); }
  let best = Infinity;
  for (const [x, y] of can.px) { const k = can.y + y; if (rows.has(k)) best = Math.min(best, (can.x + x) * d - rows.get(k) - 1); }
  return best;
}
/** Screen px the raccoon and the shoved can share. */
function overlap(f) {
  const [rac, can] = layout(f).sort((a, b) => b.rac - a.rac), seen = new Set(rac.px.map(([x, y]) => `${rac.x + x},${rac.y + y}`));
  return can.px.filter(([x, y]) => seen.has(`${can.x + x},${can.y + y}`)).length;
}
function differ(a, b) {
  const p = a.getContext('2d').getImageData(0, 0, a.width, a.height).data, q = b.getContext('2d').getImageData(0, 0, b.width, b.height).data;
  let n = 0; for (let i = 0; i < p.length; i += 4) if (p[i] !== q[i] || p[i + 1] !== q[i + 1] || p[i + 2] !== q[i + 2]) n++;
  return n;
}
function report(id, ok, text) { const el = document.getElementById(id); el.className = `check ${ok ? 'ok' : 'bad'}`; el.textContent = `${ok ? '✓' : '✗'} ${text}`; }

let B, starts, END, clock = 0, last = null;
function build() {
  B = setup();
  const ms = ui.ms[timing()];
  starts = []; END = 0;
  for (const m of ms) { starts.push(END); END += m; }
  const fs = B.frames, lastF = fs[fs.length - 1];
  const want = { crawl: [true, 1, 0], push: [true, 1, 1], stuck: [false, 0, 0], idle: [false, 0, 0] }[ui.act];
  report('check-rules', B.r.ok === want[0] && B.rac === want[1] && B.can === want[2],
    `the rules: ${B.r.ok ? B.r.kind : B.r.reason} · raccoon ${B.rac} cell, can ${B.can} cell`);
  const a = canvasOf(N * C), b = canvasOf(N * C);
  paint(a.getContext('2d'), fs[0]); still(b.getContext('2d'), B.s);
  const d0 = differ(a, b);
  report('check-start', d0 === 0, `first frame is the board before the press${d0 ? ` · ${d0} px differ` : ''}`);
  paint(a.getContext('2d'), lastF); still(b.getContext('2d'), B.next);
  const d1 = differ(a, b);
  report('check-end', d1 === 0, `last frame is the board after it${d1 ? ` · ${d1} px differ` : ''}`);
  if (ui.act === 'crawl' || ui.act === 'idle') document.getElementById('check-touch').textContent = '';
  else if (B.v[1]) {
    const bad = fs.map((f, i) => [i, f, overlap(f)]).filter(([, f, n]) => TOUCH.test(f.name) !== n > 0);
    report('check-touch', !bad.length, bad.length ? `contact wrong on ${bad.map(([i, f, n]) => `${i} ${f.name} (${n} px shared)`).join(', ')}`
      : 'the raccoon and the can overlap on every shoving frame, and on no other');
  } else {
    const bad = fs.map((f, i) => [i, f, gap(f)]).filter(([, f, g]) => g < 0 || (TOUCH.test(f.name) && g !== 0));
    report('check-touch', !bad.length, bad.length ? `contact wrong on ${bad.map(([i, f, g]) => `${i} ${f.name} (${g} px)`).join(', ')}`
      : 'the head is on the can on every shoving frame, and never in it');
  }
  controls(); strip(); bar();
}

function controls() {
  const fs = B.frames, ms = ui.ms[timing()];
  document.getElementById('ctl').innerHTML = fs.map((f, i) =>
    `<label for="m-${i}" id="l-${i}">${i} ${f.name}</label><input type="range" id="m-${i}" min="0" max="600" step="10" value="${ms[i]}"><span class="read" id="r-${i}">${ms[i]} ms</span>`).join('');
  fs.forEach((f, i) => document.getElementById(`m-${i}`).oninput = e => {
    ms[i] = Number(e.target.value); document.getElementById(`r-${i}`).textContent = `${ms[i]} ms`; save();
    starts = []; END = 0; for (const m of ms) { starts.push(END); END += m; } bar();
  });
}
function strip() {
  const fs = B.frames, z = 3, [vx, vy] = B.v, w = vy ? C : 4 * C, h = vy ? 4 * C : C, c = document.getElementById('strip');
  c.width = fs.length * (w + 4) * z; c.height = (h + 14) * z;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  const tile = canvasOf(N * C);
  fs.forEach((f, i) => {
    paint(tile.getContext('2d'), f);
    const sx = vy ? MID * C : (vx > 0 ? MID - 1 : MID - 2) * C, sy = vy ? (vy > 0 ? MID - 1 : MID - 2) * C : MID * C;
    g.drawImage(tile, sx, sy, w, h, i * (w + 4) * z, 0, w * z, h * z);
    const note = ui.act === 'crawl' || ui.act === 'idle' ? '' : vy ? ` · ${overlap(f)} px` : ` · gap ${gap(f)}`;
    g.fillStyle = '#1a1a1a'; g.font = `${4 * z}px system-ui`;
    g.fillText(`${i} ${f.name}`, i * (w + 4) * z + 2, (h + 6) * z); g.fillText(note.slice(3), i * (w + 4) * z + 2, (h + 12) * z);
  });
}

const view = document.getElementById('view');
function frameIndex(t) { let i = 0; while (i + 1 < starts.length && t >= starts[i + 1]) i++; return i; }
function show() {
  const z = ui.zoom, i = frameIndex(clock), f = B.frames[i];
  view.width = N * C * z; view.height = N * C * z;
  const g = view.getContext('2d'); g.imageSmoothingEnabled = false;
  const tile = canvasOf(N * C);
  paint(tile.getContext('2d'), f);
  g.drawImage(tile, 0, 0, N * C * z, N * C * z);
  if (ui.onion && i > 0) {
    const prev = canvasOf(N * C); paint(prev.getContext('2d'), B.frames[i - 1]);
    g.globalAlpha = 0.35; g.drawImage(prev, 0, 0, N * C * z, N * C * z); g.globalAlpha = 1;
  }
  document.getElementById('frame-read').textContent = `frame ${i} of ${B.frames.length - 1} · ${f.name} · ${Math.round(clock)} of ${END} ms`;
  document.querySelectorAll('.ctl label').forEach(l => l.classList.toggle('now', l.id === `l-${i}`));
  document.getElementById('scrub').max = B.frames.length - 1; document.getElementById('scrub').value = i;
}
function tick(now) {
  if (ui.playing && last !== null) { clock += (now - last) * ui.speed / 100; if (clock >= END) clock = 0; }
  last = now; show(); requestAnimationFrame(tick);
}
function bar() {
  document.querySelectorAll('[data-act]').forEach(b => b.setAttribute('aria-pressed', b.dataset.act === ui.act));
  document.querySelectorAll('[data-dir]').forEach(b => b.setAttribute('aria-pressed', b.dataset.dir === ui.dir));
  document.getElementById('play').textContent = ui.playing ? 'pause' : 'play';
  document.getElementById('onion').textContent = ui.onion ? 'on' : 'off';
  document.getElementById('speed-read').textContent = `${ui.speed}%`;
  document.getElementById('zoom-read').textContent = `${ui.zoom * 100}%`;
}
const step = i => { ui.playing = false; clock = starts[Math.max(0, Math.min(B.frames.length - 1, i))]; save(); bar(); };
document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { ui.act = b.dataset.act; clock = 0; save(); build(); });
document.querySelectorAll('[data-dir]').forEach(b => b.onclick = () => { ui.dir = b.dataset.dir; clock = 0; save(); build(); });
document.getElementById('play').onclick = () => { ui.playing = !ui.playing; save(); bar(); };
document.getElementById('prev').onclick = () => step(frameIndex(clock) - 1);
document.getElementById('next').onclick = () => step(frameIndex(clock) + 1);
document.getElementById('scrub').oninput = e => step(Number(e.target.value));
document.getElementById('onion').onclick = () => { ui.onion = !ui.onion; save(); bar(); };
document.getElementById('slow').onclick = () => { ui.speed = Math.max(10, ui.speed - 10); save(); bar(); };
document.getElementById('fast').onclick = () => { ui.speed = Math.min(200, ui.speed + 10); save(); bar(); };
document.getElementById('zoom-out').onclick = () => { ui.zoom = Math.max(1, ui.zoom - 1); save(); bar(); };
document.getElementById('zoom-in').onclick = () => { ui.zoom = Math.min(8, ui.zoom + 1); save(); bar(); };
document.getElementById('reset').onclick = () => { ui.ms[timing()] = [...authored[timing()]]; save(); build(); };
for (const a of Object.keys(ACTIONS.side)) if (ui.ms[a]) { ui.ms[`side ${a}`] ??= ui.ms[a]; delete ui.ms[a]; }
for (const k in authored) if (ui.ms[k]?.length !== authored[k].length) ui.ms[k] = [...authored[k]];
build();
requestAnimationFrame(tick);
window.__cartoon = { checks: () => [...document.querySelectorAll('.check')].map(e => e.textContent).filter(Boolean),
  pick: (act, dir) => { ui.act = act; ui.dir = dir; build(); } };
</script>
</body>
</html>
